const KEY = "site-lock-key";
// 마지막 접속에서 30일 넘게 안 들어오면 기억한 암호를 지우고 다시 묻는다(접속할 때마다 날짜 갱신, 두 사이트 공유)
const SEEN = "site-lock-seen", FORGET_MS = 30 * 86400000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.ct)));
  try { localStorage.setItem(KEY, pw); localStorage.setItem(SEEN, String(Date.now())); } catch (e) {}
  window.__sitePw = pw;  // 따로 암호화한 그림·영상(m 폴더)을 풀 때 씀
  document.open(); document.write(html); document.close();
}
function ask(err) {
  document.getElementById("f").style.display = "block";
  const m = document.getElementById("msg");
  if (err) { m.textContent = "암호가 틀렸어요"; m.className = "err"; }
  document.getElementById("pw").focus();
}
document.getElementById("f").onsubmit = e => {
  e.preventDefault();
  unlock(document.getElementById("pw").value.trim()).catch(() => ask(true));
};
// 비밀 링크(#k=암호)로 들어오면 암호를 기억하고 주소창에서 지운다
let pw = null;
const m = location.hash.match(/^#k=([^&]+)/);
if (m) { pw = decodeURIComponent(m[1]); history.replaceState(null, "", location.pathname + location.search); }
else {
  try {
    pw = localStorage.getItem(KEY);
    const seen = Number(localStorage.getItem(SEEN) || 0);
    if (pw && Date.now() - seen > FORGET_MS) { pw = null; localStorage.removeItem(KEY); }
  } catch (e) {}
}
if (pw) unlock(pw).catch(() => { try { localStorage.removeItem(KEY); } catch (e) {} ask(!!m); });
else ask(false);
